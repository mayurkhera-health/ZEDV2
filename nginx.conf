server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # KEEP THIS. Not staging any more -- the live site is automatesmall.com on
  # Cloudflare Pages. Whatever is still running on Fly is an older copy of the
  # same pages on a different hostname, without canonical tags. If it becomes
  # indexable it competes with the real site in search results.
  #
  # The right fix is to shut the Fly app down and delete this file, fly.toml
  # and the Dockerfile. Until someone does that, this header is what stops a
  # stale duplicate being crawled. check-copy.py --production fails if it goes.
  #
  # nginx add_header does NOT inherit into a block that sets its own, so every
  # location below repeats the full set rather than dropping two of them.
  add_header X-Robots-Tag          "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
  add_header Cache-Control          "no-cache" always;

  # Resolves /how-it-works as well as /how-it-works.html.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # styles.css and site.js are NOT fingerprinted -- the filenames never change,
  # so a cached copy is indistinguishable from a fresh one. With max-age=3600
  # a deploy could serve new HTML against an hour-old stylesheet and script,
  # which looks like the deploy silently failed or half-applied.
  #
  # "no-cache" does not mean "do not cache". The browser still stores the file
  # and still sends If-None-Match; nginx answers 304 when nothing changed, so
  # the bytes only travel when they actually differ. For a 40KB stylesheet on
  # a site with no traffic that costs nothing, and it makes what you see always
  # equal what you last deployed.
  #
  # At launch, fingerprint the filenames and put the long max-age back here.
  location /assets/ {
    add_header X-Robots-Tag          "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Cache-Control          "no-cache" always;
  }

  # Fly health check target.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript image/svg+xml;
}
