server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # STAGING ONLY — the single place this site is marked non-indexable.
  # This build carries placeholder founder details, placeholder legal entity
  # information, and a booking form that transmits nothing. Delete this header
  # (and robots.txt) when the site goes live, and nowhere else.
  #
  # nginx add_header does NOT inherit into a block that sets its own, so every
  # location below repeats the full set rather than dropping two of them.
  add_header X-Robots-Tag          "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

  # Resolves /how-it-works as well as /how-it-works.html.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location /assets/ {
    add_header X-Robots-Tag          "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Cache-Control          "public, max-age=3600" always;
  }

  # Fly health check target.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript image/svg+xml;
}
