# AutomateSmall — STAGING.
#
# This is a new, standalone Fly app. It has nothing to do with `fuelup-youth`
# (the frozen AthFuelPath rollback snapshot). Never point this file at that app.
#
# Scales to zero: the machine stops when idle and starts on the next request,
# so an unvisited staging site costs nothing but the volume-free image.

app            = "automatesmall-staging"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0
  processes            = ["app"]

  # The noindex header is set once, in nginx.conf, so there is exactly one
  # place to remove it at launch. Deliberately not duplicated here.

  [[http_service.checks]]
    interval     = "30s"
    timeout      = "5s"
    grace_period = "10s"
    method       = "GET"
    path         = "/healthz"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
